# [CI/CD] image 의 __IMAGE__ 는 services/emergency/Jenkinsfile 이 sed 로 채운다(<담당자 Docker Hub>/his-emergency:b<빌드번호>-<커밋>). 이 파일을 직접 kubectl apply 하지 않는다.
# [담당자별] emergency — 이 파일 하나가 ConfigMap + Deployment + Service 를 모두 담는다 (`---` 로 구분). Secret(emergency-secret, redis-secret)은 파일 밖이다.
# 원본: emergency-service 저장소의 k8s/emergency.yaml (image 줄만 __IMAGE__ 로 바꿈)
apiVersion: v1
kind: ConfigMap
metadata:
  name: emergency-config
  namespace: his
data:
  SPRING_DATASOURCE_USERNAME: "emergency"
  ADMIN_BASE_URL: "http://admin:9191"
  PATIENT_BASE_URL: "http://patient:8087"
  ORDER_BASE_URL: "http://outpatient:8088"
  PHARMACY_BASE_URL: "http://pharmacy:8082"
  SEAWEED_ENDPOINT: "http://192.168.49.1:18891"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency
  namespace: his
  labels:
    app: emergency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergency
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: emergency
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-admin
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z admin 9191; do sleep 3; done
      containers:
        - name: emergency
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
          envFrom:
            - configMapRef: { name: his-common-config }
            - configMapRef: { name: emergency-config }
            - secretRef:    { name: emergency-secret }
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-secret, key: REDIS_PASSWORD }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 1Gi }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: emergency
  namespace: his
spec:
  type: ClusterIP
  selector:
    app: emergency
  ports:
    - name: http
      port: 8089
      targetPort: http
