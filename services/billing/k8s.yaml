apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: his
data:
  SPRING_DATASOURCE_USERNAME: "billing"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

  # 브라우저 요청을 허용할 출처 목록
  APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:3000,http://seoulit.pe.kr:18080,http://seoulit.pe.kr:18090,http://117.16.154.233:18080,http://117.16.154.233:18090"

  # 카카오페이 결제 후 돌아올 주소
  KAKAOPAY_APPROVAL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/return"
  KAKAOPAY_CANCEL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/cancel"
  KAKAOPAY_FAIL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/fail"

  APP_ADMIN_SERVICE_HOST: "admin"
  APP_ADMIN_SERVICE_PORT: "9191"
  APP_PAIENT_SERVICE_HOST: "patient"
  APP_PAIENT_SERVICE_PORT: "8087"

  # application.properties 는 .gitignore 라 이미지에 들어가지 않는다. 앱이 필요로 하는 값을 환경변수로 넣는다
  # (비밀번호·키는 여기 두지 않고 아래 Deployment 의 env / billing-secret 에서 가져온다)
  SERVER_PORT: "8081"                                   # 안 넣으면 8080 으로 떠서 probe(8081)가 계속 실패한다
  SPRING_APPLICATION_NAME: "billingservice"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.OracleDialect"
  MYBATIS_MAPPER_LOCATIONS: "classpath:/mapper/*.xml"
  MYBATIS_CONFIGURATION_MAP_UNDERSCORE_TO_CAMEL_CASE: "true"
  SERVER_SERVLET_SESSION_TIMEOUT: "10h"
  APP_KAFKA_ENABLED: "true"
  SPRING_KAFKA_CONSUMER_GROUP_ID: "billing-service"
  BILLING_CHARGE_TOPIC_EXAM: "exam-billing-charge"
  BILLING_CHARGE_TOPIC_INPATIENT: "inpatient-billing-charge"
  BILLING_SETTLEMENT_TOPIC_COMPLETED: "settlement.completed"
  BILLING_MASTER_SOURCE_SERVICE_CODE_GROUP_ID: "918dd50f-ad11-4647-a484-a14fe599064c"
  BILLING_MASTER_CATEGORY_CODE_GROUP_ID: "ca4a6a69-3f9f-4f70-bf7d-5af42df3a11c"
  BILLING_MASTER_INSURANCE_TYPE_CODE_GROUP_ID: "0b464349-e9f7-4607-ad5d-ebe968b7e32f"
  BILLING_CHARGE_INSURANCE_TYPE_NON_INS_CODE_ID: "683e8354-9bde-4665-951b-a0eb9e2f7fe5"
  ADMIN_SERVICE_BASE_URL: "http://admin:9191"
  PATIENT_SERVICE_BASE_URL: "http://patient:8087"
  KAKAOPAY_CID: "TC0ONETIME"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: his
  labels:
    app: billing
spec:
  replicas: 1                         # billing Pod 1개 실행
  selector:
    matchLabels:
      app: billing

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0               # 교체 중 기존 Pod 유지
      maxSurge: 1                     # 새 Pod 1개 추가 허용

  template:
    metadata:
      labels:
        app: billing
    spec:
      enableServiceLinks: false

      # admin이 실행된 다음 billing 시작
      # initContainers:
      #   - name: wait-for-admin
      #     image: busybox:1.36
      #     command:
      #       - sh
      #       - -c
      #       - |
      #         echo "waiting for admin:9191 ..."
      #         until nc -z admin 9191; do sleep 3; done
      #         echo "admin is up"

      containers:
        - name: billing
          image: __IMAGE__            # Jenkins가 빌드한 이미지로 치환
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          # 공통 설정 → billing 설정 → 비밀 설정
          envFrom:
            - configMapRef:
                name: his-common-config
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret

          # DB 비밀번호: billing-secret 의 BILLING_DB_PASSWORD 를 Spring 이 읽는 이름(SPRING_DATASOURCE_PASSWORD)으로 넘긴다
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: BILLING_DB_PASSWORD

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi

          # 시작 시 최대 약 5분 동안 기동 확인
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60

          # 요청을 받을 준비가 됐는지 확인
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3

          # 실행 중 포트 응답 확인
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: his
spec:
  type: ClusterIP
  selector:
    app: billing
  ports:
    - name: http
      port: 8081
      targetPort: http
