# [담당자별] inpatient — 이 파일 하나가 ConfigMap + Deployment + Service 를 모두 담는다 (`---` 로 구분).
#
# 적용 순서 (서버에서, 이 순서대로):
#   1) Secret 을 명령으로 먼저 만든다. YAML 파일에는 비밀번호를 쓰지 않는다 (base64 는 암호화가 아니다).
#   kubectl -n his create secret generic inpatient-secret \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='실제 DB 비밀번호'
#   2) kubectl apply -f inpatient.yaml        <- 이 파일 하나만. 안에 든 3개가 위에서 아래 순서로 등록된다.
#
# 재배포: 이미지만 바꿀 때는 kubectl -n his set image deployment/inpatient inpatient=<새 이미지:태그>  (파일을 다시 apply 하지 않아도 된다)
# 주의: kubectl delete -f inpatient.yaml 은 ConfigMap·Deployment·Service 를 한꺼번에 지운다 (Secret 은 파일 밖이라 남는다).

# [담당자별] inpatient 만의 설정값. 공통 설정(Redis·Kafka·DB 주소·시간대)은 his-common-config 에 있다.
# inpatient 의 application.properties 는 admin/patient/outpatient 주소를 host + port 두 키로 읽는다.
# → 공통 ConfigMap 의 APP_ADMIN_SERVICE_BASE_URL 은 inpatient 에 적용되지 않으므로 여기서 지정한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inpatient-config
  namespace: his
data:
  SPRING_DATASOURCE_USERNAME: "inpatient"      # 이 서비스 전용 DB 계정(스키마 inpatient)

  APP_ADMIN_SERVICE_HOST: "admin"              # properties 의 app.admin-service.host
  APP_ADMIN_SERVICE_PORT: "9191"               # admin 포트는 9191 로 고정 (2026-10-13)
  APP_PATIENT_SERVICE_HOST: "patient"
  APP_PATIENT_SERVICE_PORT: "8087"
  APP_OUTPATIENT_SERVICE_HOST: "outpatient"    # 처방 등록·전송·취소(REST)를 보내는 외래 처방코어
  APP_OUTPATIENT_SERVICE_PORT: "8088"
---
# [담당자별] inpatient Deployment — 서비스를 실행하는 방법
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inpatient
  namespace: his
  labels:
    app: inpatient
spec:
  replicas: 1                          # 1개 유지. Kafka 소비 그룹(inpatient-service)을 단순하게 두려고 늘리지 않는다
  selector:
    matchLabels:
      app: inpatient                   # 아래 template.labels 와 반드시 같아야 한다
  strategy:
    type: RollingUpdate                # Pod 교체 시 "새 Pod 먼저 띄움 -> 옛 Pod 내림" (잠깐 끊김). 단일 인프라가 두 개 겹쳐 뜨지 않게 한다
    rollingUpdate:
      maxUnavailable: 0                # 새 Pod 가 Ready 가 된 뒤에야 옛 Pod 를 내린다
      maxSurge: 1
  template:
    metadata:
      labels:
        app: inpatient
    spec:
      enableServiceLinks: false        # Service 정보가 환경변수로 자동 주입되어 충돌하는 것을 막는다

      # admin 이 응답할 때까지 기다린 뒤 본 컨테이너를 시작한다 (병동 공통코드 조회가 admin 을 부른다)
      initContainers:
        - name: wait-for-admin
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for admin:9191 ..."
              until nc -z admin 9191; do sleep 3; done
              echo "admin is up"

      containers:
        - name: inpatient
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086                # server.port 와 같아야 한다

          envFrom:
            - configMapRef:
                name: his-common-config          # 공통 설정
            - configMapRef:
                name: inpatient-config           # 내 서비스 설정
            - secretRef:
                name: inpatient-secret           # 내 비밀번호

          env:
            - name: REDIS_PASSWORD               # 세션(Redis) 비밀번호는 모두가 같은 Secret 을 쓴다
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi              # JAVA_TOOL_OPTIONS 의 MaxRAMPercentage=70 -> 힙 약 700Mi

          # actuator 가 없어 포트(tcpSocket)로 확인한다.
          startupProbe:                # 기동이 끝날 때까지 기다려 준다(최대 5분)
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
# [담당자별] inpatient Service — 고정 이름과 주소
# 프론트 이미지에 http://inpatient:8086 이 굳어 있으므로 이름과 포트를 바꾸지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: inpatient          # 클러스터 안 주소: http://inpatient:8086
  namespace: his
spec:
  type: ClusterIP          # 클러스터 안에서만 접근 (외부 노출 금지)
  selector:
    app: inpatient
  ports:
    - name: http
      port: 8086
      targetPort: http
