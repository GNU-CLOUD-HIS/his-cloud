# [공통] 공통 설정 + 인프라(Redis, Kafka, SeaweedFS) — 이 파일 하나에 모두 들어 있다 (`---` 로 구분). 공통 담당 1명이 적용한다.
#
# 들어 있는 것 (위에서 아래 순서로 등록된다)
#   ConfigMap his-common-config  /  Redis (Deployment+Service)  /  Kafka (Deployment+Service)
#   /  SeaweedFS (PVC+Deployment+Service)
#
# 적용 순서 (서버에서, 이 순서대로):
#   1) kubectl create namespace his                       <- 작업 공간. 한 번만. (이미 있으면 AlreadyExists 는 무시)
#   2) read -rsp "Redis 비밀번호: " P; echo        <- guest4 는 셸 기록을 모두가 같이 보므로 비밀번호를 직접 치지 않는다
#      kubectl -n his create secret generic redis-secret --from-literal=REDIS_PASSWORD="$P"; unset P
#   3) kubectl apply -f common.yaml
#
# !! 주의 !!
#   kubectl delete -f common.yaml 을 하지 않는다. 이 파일에는 SeaweedFS 의 PersistentVolumeClaim(seaweedfs-data)이 들어 있어서
#   지우면 저장된 파일(영상·직원 사진)이 같이 사라지고, Redis·Kafka 도 내려가 모든 서비스가 영향을 받는다.
#   일부만 내려야 하면:  kubectl -n his delete deployment <이름>   처럼 대상을 직접 지정한다.
#   프론트는 따로 관리한다(30-hisfrontend.yaml). 이미지와 외부 포트를 별도로 자주 바꾸기 때문이다.

# [공통] 모든 백엔드가 같이 쓰는 설정값 (ConfigMap).
# 각 담당자는 자기 Deployment 에서 이 ConfigMap 을 envFrom 으로 가져다 쓴다.
# 이렇게 한 곳에 모아 두면 "Redis 주소가 바뀌었다" 같은 일이 생겨도 이 파일만 고치면 된다.
#
# 키 이름 규칙(Spring Boot 환경변수): 점(.)과 하이픈(-)을 밑줄(_)로, 모두 대문자
#   spring.data.redis.host        ->  SPRING_DATA_REDIS_HOST
#   app.admin-service.base-url    ->  APP_ADMIN_SERVICE_BASE_URL
# 환경변수는 jar 안의 application.properties 값보다 우선한다(= jar 를 다시 안 만들어도 된다).
#
# 주의: 서비스마다 properties 의 키 이름이 다를 수 있다. 자기 서비스에 같은 키가 있는지 확인하고,
#       없는 키는 무시되므로(에러 없이) 자기 서비스 ConfigMap 에 맞는 이름으로 따로 적는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: his-common-config
  namespace: his
data:
  # --- 시간대·인코딩·JVM 메모리 (컨테이너 기본은 UTC -> DB 시각이 9시간 어긋나는 것 방지) ---
  TZ: "Asia/Seoul"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul -Dfile.encoding=UTF-8 -XX:MaxRAMPercentage=70"

  # --- 클러스터 안의 공용 구성요소: Service 이름이 곧 주소 ---
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  APP_ADMIN_SERVICE_BASE_URL: "http://admin:9191"     # admin 포트는 9191 로 고정 (2026-10-13). Service port/targetPort/containerPort 모두 9191

  # --- DB (클러스터 밖의 Oracle) --- 검사영상·약제 모두 같은 주소 확인됨(2026-10-13)
  SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@seoulit.pe.kr:1521/freepdb1"
  # 10개 서비스가 동시에 접속해도 ORA-12516(DB 동시 접속 한도)이 나지 않도록 풀을 작게
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_JPA_SHOW_SQL: "false"
---
# [공통-인프라] Redis — 로그인 세션 공유 (admin 이 발급, 전 서비스가 읽음)
# 공식 이미지를 그대로 쓰므로 직접 빌드하지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: his
spec:
  replicas: 1
  strategy:
    type: Recreate          # 단일 Pod 인프라는 '먼저 내리고 새로 띄움'이 안전하다
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8.10.1-alpine   # 서버에서 실제 돌고 있는 버전 확인됨(2026-10-13, redis-server --version). Docker Hub 태그 존재 확인됨
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)        # 아래 env 의 값이 $(변수) 문법으로 치환된다
            - --appendonly             # 팀 공용 compose 와 같은 옵션. 저장 공간(볼륨)이 없으면 Pod 재시작 때 사라진다
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 5
          # 데이터 볼륨 없음: 세션만 저장하므로 재시작하면 전원 재로그인만 하면 된다.
---
apiVersion: v1
kind: Service
metadata:
  name: redis               # 클러스터 안 주소: redis:6379
  namespace: his
spec:
  type: ClusterIP           # 클러스터 밖으로 열지 않는다
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# [공통-인프라] Kafka (KRaft 단일 노드) — 서비스 간 이벤트
# 이미지 태그는 서버에서 실제 돌고 있는 버전으로 확인·고정했다(2026-10-13).
# 서버의 Kafka는 /mnt/data/users/gguest2/kafka-4.3.1-src 에서 소스 빌드로 떠 있고(ps aux 로 확인),
# 버전 4.3.1 은 apache/kafka 공식 이미지에도 정식 릴리스 태그로 존재한다(Docker Hub 확인됨).
# 3.x -> 4.x 는 메이저 업그레이드라 호환성 변경이 있을 수 있으니, 적용 후 토픽 생성·메시지 송수신을 반드시 확인한다.
#
# 핵심 3가지
#  1) KAFKA_ADVERTISED_LISTENERS 는 '클라이언트가 접속할 주소'. 클러스터 안에서는 Service 이름 kafka:9092.
#  2) Service 이름이 kafka 이면 K8s 가 KAFKA_PORT 같은 환경변수를 자동 주입해 이미지가 오작동하는 문제가 있어
#     enableServiceLinks: false 가 사실상 필수.
#  3) 단일 브로커이므로 복제 관련 설정을 모두 1 로 낮춘다(기본값이 3이면 내부 토픽 생성이 실패).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: his
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.3.1          # latest 금지. 서버 실제 버전으로 고정(확인됨)
          ports:
            - containerPort: 9092
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # 데이터는 컨테이너 안에 있어 Pod 가 다시 뜨면 사라진다.
          # 미소비 메시지가 사라져도 INTERFACE_SEND_LOG 는 DB 기준으로 재처리된다.
---
apiVersion: v1
kind: Service
metadata:
  name: kafka               # 클러스터 안 주소: kafka:9092
  namespace: his
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
# [공통-인프라] SeaweedFS — 영상·병리 첨부·직원 사진 파일 저장
# 팀 공용 docker-compose.yml 의 seaweedfs 서비스(`weed mini -dir=/data`)를 그대로 옮긴 것이다.
#
# 터미널 실행 때는 한 서버 안에서 포트가 겹쳤다(volume 8080 vs admin 8080).
# 쿠버네티스는 Pod 마다 자기 IP 를 가지므로 서로 다른 Pod 사이의 포트 충돌이 없다.
# [공통-인프라] SeaweedFS 데이터 저장 공간
# 용량(5Gi)은 '요청'일 뿐 minikube 기본 저장소는 크기를 강제하지 않는다.
# 실제로 쓰는 디스크는 minikube 를 실행하는 계정의 서버 디스크이며, 여유 용량은 서버 관리자에게 확인한다(가이드 3-1).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: his
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  # storageClassName 을 생략하면 minikube 기본값(standard)이 쓰인다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: his
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          # 서버는 mini 가 아니라 master/volume/filer/s3 를 각각 별도 프로세스로 띄워 쓰고 있다(ps aux 로 확인, 2026-10-13).
          # mini 는 이 네 역할을 한 프로세스로 합쳐 흉내 내는 명령이라 기능적으로는 대체되지만 완전히 같은 구성은 아니다.
          # 버전은 서버에서 실제 확인한 값(weed version)으로 고정했다. Docker Hub 태그 존재 확인됨.
          image: chrislusf/seaweedfs:4.47
          args: ["mini", "-dir=/data"]
          ports:
            - { name: master, containerPort: 9333 }
            - { name: filer, containerPort: 8888 }
            - { name: s3, containerPort: 8333 }
            - { name: admin, containerPort: 23646 }     # 관리 화면. 외부로 열지 않는다
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: filer }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        # minikube 의 기본 StorageClass(standard)가 서버 디스크에 자리를 만들어 준다.
        # Pod 를 다시 띄우거나 `minikube stop/start` 를 해도 파일은 남는다.
        # 단, `minikube delete` 를 하면 함께 사라진다.
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        # 연습용으로 파일을 남기지 않아도 되면 위 두 줄(persistentVolumeClaim 부분)을 지우고 아래로 바꾼다.
        # - name: data
        #   emptyDir: {}
        # 주의: hostPath 는 서버가 아니라 minikube 컨테이너 안의 폴더를 가리킨다. 쓰지 않는다.
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs           # 클러스터 안 주소: seaweedfs:8888(filer), :8333(s3)
  namespace: his
spec:
  type: ClusterIP
  selector:
    app: seaweedfs
  ports:
    - { name: filer, port: 8888, targetPort: 8888 }
    - { name: s3, port: 8333, targetPort: 8333 }
    - { name: master, port: 9333, targetPort: 9333 }
