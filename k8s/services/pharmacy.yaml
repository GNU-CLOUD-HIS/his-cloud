# [CI/CD] image 의 __IMAGE__ 는 Jenkinsfile.backend 가 sed 로 채운다(jinki238/his-pharmacy:b<빌드번호>). 이 파일을 직접 kubectl apply 하지 않는다.
# [담당자별] pharmacy(약제) — 이 파일 하나가 ConfigMap + Deployment + Service 를 모두 담는다 (`---` 로 구분).
#
# 적용 순서 (서버에서, 이 순서대로):
#   1) Secret 을 명령으로 먼저 만든다. YAML 파일에는 비밀번호를 쓰지 않는다 (base64 는 암호화가 아니다).
#   (guest4 는 셸 기록을 모두가 같이 보므로 비밀번호를 명령에 직접 치지 않는다)
#   read -rsp "약제 DB 비밀번호: " P; echo
#   read -rsp "공공데이터 키 (없으면 Enter): " K; echo
#   kubectl -n his create secret generic pharmacy-secret --from-literal=PHARMACY_DB_PASSWORD="$P" --from-literal=PUBLIC_DATA_MEDICATION_SERVICE_KEY="$K"; unset P K
#   2) kubectl apply -f pharmacy.yaml        <- 이 파일 하나만. 안에 든 3개가 위에서 아래 순서로 등록된다.
#
# 재배포: 이미지만 바꿀 때는 kubectl -n his set image deployment/pharmacy pharmacy=<새 이미지:태그>  (파일을 다시 apply 하지 않아도 된다)
# 주의: kubectl delete -f pharmacy.yaml 은 ConfigMap·Deployment·Service 를 한꺼번에 지운다 (Secret 은 파일 밖이라 남는다).

# [담당자별] pharmacy 만의 설정값. 공통 설정(DB 주소·시간대·Hikari 등)은 his-common-config 에 있다.
# 약제 application.properties 는 서비스 고유 환경변수 이름(${PHARMACY_DB_USERNAME:...} 등)을 쓴다.
# 공통 ConfigMap 의 APP_ADMIN_SERVICE_BASE_URL 은 약제에 적용되지 않으므로 ADMIN_API_BASE_URL 을 여기 둔다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pharmacy-config
  namespace: his
data:
  PHARMACY_DB_USERNAME: "pharmacy"                   # 이 서비스 전용 DB 계정(스키마 PHARMACY)
  ADMIN_API_BASE_URL: "http://admin:9191"            # admin.api.base-url (공통코드 캐시 적재용)
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"              # [확인 필요] 외래 서비스가 발행하는 Kafka 와 같은 브로커여야 한다
  # 토픽 이름은 properties 기본값을 그대로 쓴다(opd.pharmacy-order.requested.v1 / cancelled.v1 / phm.pharmacy-order.resulted.v1).
  # 공공 API 주소도 기본값을 쓴다(PUBLIC_DATA_MEDICATION_BASE_URL).
  #
  # 쿠버네티스 프론트가 18090을 쓰므로 활성화함(2026-10-13, 18090 CORS 403 확인 후). 환경변수는 목록을 통째로 교체한다.
  APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:3000,http://127.0.0.1:3000,http://seoulit.pe.kr:18080,http://seoulit.pe.kr:18090,http://117.16.154.233:18080,http://117.16.154.233:18090"
---
# [담당자별] pharmacy Deployment — 서비스를 실행하는 방법
# 다른 서비스 담당자는 이 파일을 복사해서 아래 '바꿀 곳' 6군데만 고친다.
#   (1) metadata.name  (2) labels app 값(3곳)  (3) image  (4) containerPort  (5) envFrom 의 configMap/secret 이름
#   (6) resources(필요하면)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy                     # (1) 서비스 이름
  namespace: his
  labels:
    app: pharmacy                    # (2)
spec:
  replicas: 1                          # 처음엔 1개. 공통코드 캐시가 Pod 마다 있고 Kafka 소비 그룹을 단순하게 두려고 늘리지 않는다
  selector:
    matchLabels:
      app: pharmacy                  # (2) 아래 template.labels 와 반드시 같아야 한다
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                # 새 Pod 가 Ready 가 된 뒤에야 옛 Pod 를 내린다
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pharmacy                # (2)
    spec:
      enableServiceLinks: false        # Service 정보가 환경변수로 자동 주입되어 충돌하는 것을 막는다

      # 약제는 시작할 때 admin 의 공통코드를 한 번만 읽고, admin 이 안 떠 있으면 빈 캐시로 계속 뜬다(CommonCodeCache).
      # 그래서 admin 이 응답할 때까지 기다린 뒤 본 컨테이너를 시작한다.
      # (admin 담당 서비스 자신은 이 initContainers 블록을 빼야 한다. 자기 자신을 기다리게 된다)
      initContainers:
        - name: wait-for-admin
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for admin:9191 ..."
              # busybox 의 nc 가 -z 를 지원하지 않으면: until nc -w 2 admin 9191 </dev/null; do ...
              until nc -z admin 9191; do sleep 3; done
              echo "admin is up"

      containers:
        - name: pharmacy
          image: __IMAGE__    # (3) 본인 Docker Hub 아이디/이미지:태그 (latest 금지)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082                    # (4) server.port 와 같아야 한다

          envFrom:
            - configMapRef:
                name: his-common-config              # 공통 설정
            - configMapRef:
                name: pharmacy-config              # (5) 내 서비스 설정
            - secretRef:
                name: pharmacy-secret              # (5) 내 비밀번호

          env:
            # 약제는 Redis(세션)를 쓰지 않으므로 REDIS_PASSWORD 를 넣지 않는다.
            # Downward API: Pod 이름·노드 이름을 앱이 알 수 있다(로그 추적에 유용)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # 시작값이다. 띄운 뒤 kubectl top pod 로 보고 조정한다.
          # limits.memory 가 너무 작으면 OOMKilled(종료코드 137)로 재시작을 반복한다.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi              # JAVA_TOOL_OPTIONS 의 MaxRAMPercentage=70 -> 힙 약 700Mi
              # cpu limit 은 일부러 생략: JVM 기동은 CPU 를 몰아 쓰는데 limit 이 낮으면 몇 배 느려진다

          # actuator 가 없는 서비스는 포트(tcpSocket)로 확인한다.
          startupProbe:                # 기동이 끝날 때까지 기다려 준다(최대 5분)
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:              # 실패하면 Service 의 대상에서 빠진다(재시작은 안 함)
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:               # 실패가 이어지면 컨테이너를 재시작한다
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
# [담당자별] pharmacy Service — 이 서비스에 붙는 고정 이름과 주소
# Pod 는 다시 뜨면 IP 가 바뀐다. Service 는 바뀌지 않는 '이름'을 준다.
# 프론트 이미지에 http://pharmacy:8082 가 굳어 있으므로 이름과 포트를 바꾸지 않는다(개발표준가이드 11.6, 프론트의 약제 포트 8082).
apiVersion: v1
kind: Service
metadata:
  name: pharmacy          # 클러스터 안 주소: http://pharmacy:8082
  namespace: his
spec:
  type: ClusterIP           # 클러스터 안에서만 접근 (외부 노출 금지)
  selector:
    app: pharmacy         # 이 라벨을 가진 Pod 로 트래픽을 보낸다
  ports:
    - name: http
      port: 8082            # Service 가 받는 포트(다른 서비스·프론트가 부르는 번호)
      targetPort: http      # Pod 의 containerPort 이름(http = 8082)
